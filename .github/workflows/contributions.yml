name: Refresh custom contribution artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/contributions/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/contributions
      - run: npm test && npm run build
        working-directory: tools/contributions
      - name: Publish only generated contribution assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contributions*.svg assets/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public contribution artwork"
          git push
