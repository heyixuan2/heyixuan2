<svg xmlns="http://www.w3.org/2000/svg" width="288" height="76" viewBox="0 0 288 76" role="img" aria-labelledby="nav-title"><title id="nav-title">LinkedIn</title><svg x="4" xmlns="http://www.w3.org/2000/svg" width="284" height="76" viewBox="0 0 284 76" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn</title><desc id="desc">Open LinkedIn. Orange editorial linework animates; text remains still. Motion follows your system preference.</desc>
<defs><clipPath id="frame"><rect x=".5" y=".5" width="283" height="75" rx="2"/></clipPath><linearGradient id="wash"><stop stop-color="#332820" stop-opacity="0"/><stop offset=".5" stop-color="#332820" stop-opacity=".7"/><stop offset="1" stop-color="#332820" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f3efe6}.label{font-weight:900;letter-spacing:-.65px}.note{font-family:Menlo,Consolas,monospace;fill:#bcb3a7;letter-spacing:.65px;font-size:8.5px}.orbit{transform-origin:14px 14px}.travel{transform:translateX(-364px)}
@media(prefers-reduced-motion:no-preference){
.travel{animation:travel 5.6s cubic-bezier(.4,0,.2,1) infinite}.arrow{animation:arrow 4.8s ease-in-out infinite}.down{animation:down 4.8s ease-in-out infinite}.orbit{animation:orbit 9s linear infinite}.trace{stroke-dasharray:90;animation:trace 5.6s ease-in-out infinite}.beacon{animation:beacon 4.2s ease-in-out infinite}.layer-one{animation:layer1 5s ease-in-out infinite}.layer-two{animation:layer2 5s ease-in-out infinite}
}
@keyframes travel{0%,12%{transform:translateX(-364px)}65%,100%{transform:translateX(364px)}}
@keyframes arrow{0%,40%,100%{transform:translate(0,0)}54%{transform:translate(3px,-3px)}68%{transform:translate(0,0)}}
@keyframes down{0%,40%,100%{transform:translateY(0)}54%{transform:translateY(4px)}68%{transform:translateY(0)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes trace{0%,12%,100%{stroke-dashoffset:0;opacity:1}40%{stroke-dashoffset:90;opacity:.3}75%{stroke-dashoffset:0;opacity:1}}
@keyframes beacon{0%,30%,100%{opacity:1}50%{opacity:.35}70%{opacity:1}}
@keyframes layer1{0%,20%,80%,100%{transform:translateY(0)}45%{transform:translateY(-3px)}}
@keyframes layer2{0%,30%,90%,100%{transform:translateY(0)}55%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#frame)"><rect width="284" height="76" fill="#191a1b"/><rect class="travel" x="92" width="100" height="76" fill="url(#wash)"/><path d="M18 72H266" stroke="#41403c"/><path d="M18 72h26" stroke="#ff7b43" stroke-width="2"/><path class="travel" d="M98 72h88" stroke="#ff7b43" stroke-width="2"/>
<text class="note" x="59" y="26">Let’s Connect</text>
<text class="label" x="59" y="46" font-size="19">LinkedIn</text>
<g transform="translate(18 24)"><rect x="1" y="1" width="26" height="26" rx="2" fill="#f3efe6"/><g fill="#191a1b"><circle cx="7.4" cy="8" r="1.8"/><path d="M5.9 11h3v10h-3zm5.5 0h2.9v1.4c.7-1.1 1.7-1.7 3.2-1.7 2.9 0 3.7 1.7 3.7 4.4V21h-3v-5.2c0-1.3-.1-2.5-1.7-2.5s-2.1 1.2-2.1 2.4V21h-3z"/></g><path class="trace" d="M1 1h26v26H1z" fill="none" stroke="#ff7b43" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(255 39)"><g class="arrow" fill="none" stroke="#f3efe6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 5L5-5M-3-5h8v8"/></g></g>
</g><rect x=".5" y=".5" width="283" height="75" rx="2" fill="none" stroke="#41403c"/>
</svg>
</svg>
