<style>text{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:#f3efe6;letter-spacing:-.5px}.orbit{transform-origin:14px 14px}.trace{stroke-dasharray:90}@media(prefers-reduced-motion:no-preference){.orbit{animation:orbit 9s linear infinite}.trace{animation:trace 5.6s ease-in-out infinite}.rule{animation:rule 5.6s ease-in-out infinite}.layer-one{animation:layer1 5s ease-in-out infinite}.layer-two{animation:layer2 5s ease-in-out infinite}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes trace{0%,100%{stroke-dashoffset:0}40%{stroke-dashoffset:90}75%{stroke-dashoffset:0}}@keyframes rule{0%,100%{transform:translateX(0)}50%{transform:translateX(104px)}}@keyframes layer1{0%,100%{transform:translateY(0)}45%{transform:translateY(-3px)}}@keyframes layer2{0%,100%{transform:translateY(0)}55%{transform:translateY(-4px)}}</style>
