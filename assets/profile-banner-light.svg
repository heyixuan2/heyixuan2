  </defs>
  <rect width="1280" height="360" rx="18" fill="#fbfbfa"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)" opacity="0.8"/>
  <g fill="none" stroke="#2463eb" stroke-width="2" opacity="0.18">
