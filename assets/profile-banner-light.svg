  <desc id="desc">A light technical grid banner with blue accents.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#dfe6f1" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfbfa" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#fbfbfa" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#fbfbfa"/>
